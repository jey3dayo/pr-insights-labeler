name: Quality Checks

on:
  push:
    branches:
      - main
      - develop
      - "feat/**"
      - "feature/**"
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, develop]

concurrency:
  # PRとpushで異なるグループを使用してコンフリクトを防止
  group: quality-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      docs-only: ${{ steps.changes.outputs.docs-only }}
      markdown-changed: ${{ steps.changes.outputs.markdown-changed }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect file changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          # PRの場合は base との差分を取得、pushの場合はGitHubコンテキストを使用
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base_ref="$BASE_SHA"

            # フォークPRの場合のフォールバック処理
            if ! git rev-parse --verify "$base_ref" >/dev/null 2>&1; then
              echo "Base SHA not accessible, trying base branch: $BASE_REF"
              base_ref="origin/$BASE_REF"

              # それでもダメな場合は最終フォールバック
              if ! git rev-parse --verify "$base_ref" >/dev/null 2>&1; then
                echo "Base branch not accessible, using HEAD~1 as fallback"
                base_ref="HEAD~1"
              fi
            fi

            changed_files=$(git diff --name-only "$base_ref"..HEAD)
          else
            # pushの場合はGitHubコンテキストを使用
            before_sha="$BEFORE_SHA"
            current_sha="$CURRENT_SHA"

            if [ -z "$before_sha" ] || [ "$before_sha" = "0000000000000000000000000000000000000000" ]; then
              # 初回コミットまたは空の場合は全ファイルを対象
              echo "Initial commit or empty before SHA detected, listing all files"
              changed_files=$(git ls-tree -r --name-only "$current_sha")
            else
              # 通常のpushの場合
              echo "Using GitHub context: $before_sha..$current_sha"

              if ! git cat-file -e "$before_sha^{commit}" >/dev/null 2>&1; then
                echo "Before SHA not present locally. Fetching from origin for fallback"
                git fetch --no-tags --depth=1 origin "$before_sha" || true
              fi

              if git cat-file -e "$before_sha^{commit}" >/dev/null 2>&1; then
                if ! changed_files=$(git diff --name-only "$before_sha".."$current_sha"); then
                  echo "Diff using GitHub context failed. Trying merge-base fallback"
                  if ancestor=$(git merge-base "$before_sha" "$current_sha" 2>/dev/null); then
                    echo "Using merge-base $ancestor"
                    changed_files=$(git diff --name-only "$ancestor".."$current_sha")
                  else
                    echo "Merge-base unavailable. Falling back to parent commit"
                    if git rev-parse --verify "HEAD^" >/dev/null 2>&1; then
                      changed_files=$(git diff --name-only HEAD^..HEAD)
                    else
                      echo "No parent commit available, listing all files at HEAD"
                      changed_files=$(git ls-tree -r --name-only "$current_sha")
                    fi
                  fi
                fi
              else
                echo "Before SHA not accessible after fetch. Using fallback"
                if git rev-parse --verify "HEAD^" >/dev/null 2>&1; then
                  changed_files=$(git diff --name-only HEAD^..HEAD)
                else
                  echo "No parent commit available, listing all files at HEAD"
                  changed_files=$(git ls-tree -r --name-only "$current_sha")
                fi
              fi
            fi
          fi

          echo "Changed files:"
          echo "$changed_files"

          # 変更ファイルを分類
          markdown_files=$(echo "$changed_files" | grep -E '\.md$' || true)
          code_files=$(echo "$changed_files" | grep -vE '\.md$|^docs/' || true)

          echo "Markdown files: $markdown_files"
          echo "Code files: $code_files"

          # Markdownファイルの変更があるかチェック
          if [[ -n "$markdown_files" ]]; then
            echo "markdown-changed=true" >> "$GITHUB_OUTPUT"
            echo "Markdown files have been changed"
          else
            echo "markdown-changed=false" >> "$GITHUB_OUTPUT"
            echo "No markdown files changed"
          fi

          # docs-onlyの判定（Markdownファイルのみの変更）
          if [[ -n "$changed_files" && -z "$code_files" ]]; then
            echo "docs-only=true" >> "$GITHUB_OUTPUT"
            echo "This is a docs-only change"
          else
            echo "docs-only=false" >> "$GITHUB_OUTPUT"
            echo "This includes code changes"
          fi

  docs-quality:
    name: Documentation Quality
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs['markdown-changed'] == 'true'

    steps:
      - uses: actions/checkout@v7

      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      - name: Check documentation quality
        run: |
          echo "## 📝 Documentation Quality Check" >> "$GITHUB_STEP_SUMMARY"
          if mise run docs:check; then
            echo "✅ Markdown lint and links check passed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⚠️ Some checks failed (non-blocking)" >> "$GITHUB_STEP_SUMMARY"
            # Link checkは警告のみ（失敗させない）
          fi

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs['docs-only'] == 'false'

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js Environment
        uses: ./.github/actions/setup-node-env

      - name: Restore ESLint cache
        uses: actions/cache@v6
        with:
          path: .eslintcache
          key: eslint-${{ runner.os }}-${{ hashFiles('eslint.config.js', 'package.json') }}
          restore-keys: |
            eslint-${{ runner.os }}-

      - name: Restore TypeScript cache
        uses: actions/cache@v6
        with:
          path: .tsbuildinfo
          key: tsbuildinfo-${{ runner.os }}-${{ hashFiles('tsconfig.json') }}
          restore-keys: |
            tsbuildinfo-${{ runner.os }}-

      - name: Restore Vitest cache
        uses: actions/cache@v6
        with:
          path: node_modules/.vitest
          key: vitest-${{ runner.os }}-${{ hashFiles('vitest.config.ts') }}
          restore-keys: |
            vitest-${{ runner.os }}-

      - name: Run linting
        run: |
          echo "## 🔍 Code Linting" >> "$GITHUB_STEP_SUMMARY"
          if pnpm lint; then
            echo "✅ Linting passed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ Linting failed" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Run type checking
        run: |
          echo "## 📋 Type Checking" >> "$GITHUB_STEP_SUMMARY"
          if pnpm type-check; then
            echo "✅ Type check passed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ Type check failed" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Run tests
        run: |
          echo "## 🧪 Tests" >> "$GITHUB_STEP_SUMMARY"
          if pnpm test; then
            echo "✅ All tests passed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ Some tests failed" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Check dependency violations
        continue-on-error: true
        run: |
          echo "## 🔗 Dependency Cruiser" >> "$GITHUB_STEP_SUMMARY"
          # Produce a JSON report for triage
          pnpm depcruise --output-type json > depcruise.json || true
          # Also run the default text reporter for console visibility (exit code governs the if)
          if pnpm depcruise; then
            echo "✅ No dependency violations found" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⚠️ Dependency violations detected (non-blocking)" >> "$GITHUB_STEP_SUMMARY"
            echo "See Issue #43 for remediation plan" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload depcruise report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: depcruise-report
          path: depcruise.json
          if-no-files-found: ignore

      - name: Build action
        run: |
          echo "## 📦 Build" >> "$GITHUB_STEP_SUMMARY"
          if pnpm build; then
            echo "✅ Build passed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ Build failed" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  integration-test:
    name: Integration Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs['docs-only'] == 'false'
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js Environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ matrix.node-version }}

      - name: Restore TypeScript cache
        uses: actions/cache@v6
        with:
          path: .tsbuildinfo
          key: tsbuildinfo-${{ runner.os }}-${{ hashFiles('tsconfig.json') }}
          restore-keys: |
            tsbuildinfo-${{ runner.os }}-

      - name: Restore Vitest cache
        uses: actions/cache@v6
        with:
          path: node_modules/.vitest
          key: vitest-${{ runner.os }}-${{ hashFiles('vitest.config.ts') }}
          restore-keys: |
            vitest-${{ runner.os }}-

      - name: Run integration tests
        run: |
          echo "## 🔬 Integration Tests (Node ${{ matrix.node-version }})" >> "$GITHUB_STEP_SUMMARY"
          if pnpm test:vitest __tests__/integration.test.ts; then
            echo "✅ Integration tests passed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ Integration tests failed" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Verify dist/ build
        run: |
          echo "## 📦 Verify dist/ Build" >> "$GITHUB_STEP_SUMMARY"

          # 既存のdist/をバックアップ
          cp -r dist/ dist-backup/

          # 再ビルド
          pnpm build

          # 差分チェック（環境依存の生成物は除外）
          # - *.map: ソースマップは環境によりパスが変わることがある
          # - *.d.ts, *.d.ts.map: 型定義とそのマップも環境依存の差分が出やすい
          if diff -r \
            -x "*.map" \
            -x "*.d.ts" \
            -x "*.d.ts.map" \
            dist/ dist-backup/ > /dev/null 2>&1; then
            echo "✅ dist/ is up to date" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "⚠️ dist/ differs from committed version"
              echo "Run \`pnpm build\` and commit the changes"
              echo "(non-deterministic files are excluded: *.map, *.d.ts, *.d.ts.map)"
            } >> "$GITHUB_STEP_SUMMARY"
            diff -r -x "*.map" -x "*.d.ts" -x "*.d.ts.map" dist/ dist-backup/ || true
            exit 1
          fi

  self-check:
    name: PR Insights Labeler Self-Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write
      issues: write
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run PR Insights Labeler (self-check)
        uses: ./
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          file_size_limit: "100KB"
          file_lines_limit: "500"
          pr_additions_limit: "5000"
          pr_files_limit: "50"
          comment_on_pr: "auto"
          # Selective label enabling (all enabled by default)
          size_enabled: "true"
          complexity_enabled: "false"
          category_enabled: "true"
          risk_enabled: "true"
          enable_summary: "true"
          language: "ja"
          # Workflow failure control (disabled for self-check)
          fail_on_large_files: ""
          fail_on_too_many_files: ""
          fail_on_pr_size: ""
          additional_exclude_patterns: |
            src/index.ts
            scripts/**

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [detect-changes, docs-quality, code-quality, integration-test, self-check]
    if: always()

    steps:
      - name: Determine overall result
        run: |
          docs_only="${{ needs.detect-changes.outputs['docs-only'] }}"
          markdown_changed="${{ needs.detect-changes.outputs['markdown-changed'] }}"
          docs_result="${{ needs.docs-quality.result }}"
          code_result="${{ needs.code-quality.result }}"
          integration_result="${{ needs.integration-test.result }}"
          self_check_result="${{ needs.self-check.result }}"

          echo "## 🎯 Quality Gate Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [[ "$docs_only" == "true" ]]; then
            # ドキュメントのみの変更
            echo "📝 **Documentation-only PR detected**" >> "$GITHUB_STEP_SUMMARY"

            if [[ "$docs_result" == "success" ]] || [[ "$docs_result" == "skipped" ]]; then
              echo "✅ Documentation quality checks passed" >> "$GITHUB_STEP_SUMMARY"
              echo "result=success" >> "$GITHUB_OUTPUT"
              exit 0
            else
              echo "❌ Documentation quality checks failed" >> "$GITHUB_STEP_SUMMARY"
              echo "result=failure" >> "$GITHUB_OUTPUT"
              exit 1
            fi
          else
            # コード変更を含む
            echo "💻 **Code changes detected**" >> "$GITHUB_STEP_SUMMARY"

            all_success=true

            # コード品質チェック結果
            if [[ "$code_result" == "success" ]]; then
              echo "✅ Code quality checks passed" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "❌ Code quality checks failed" >> "$GITHUB_STEP_SUMMARY"
              all_success=false
            fi

            # 統合テスト結果
            if [[ "$integration_result" == "success" ]]; then
              echo "✅ Integration tests passed" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "❌ Integration tests failed" >> "$GITHUB_STEP_SUMMARY"
              all_success=false
            fi

            # 自己チェック結果（PR時のみ）
            if [[ "$self_check_result" == "success" ]]; then
              echo "✅ PR Insights Labeler self-check passed" >> "$GITHUB_STEP_SUMMARY"
            elif [[ "$self_check_result" == "failure" ]]; then
              echo "❌ PR Insights Labeler self-check failed" >> "$GITHUB_STEP_SUMMARY"
              all_success=false
            fi

            # Markdownファイルも変更されている場合
            if [[ "$markdown_changed" == "true" ]]; then
              if [[ "$docs_result" == "success" ]]; then
                echo "✅ Documentation quality checks passed" >> "$GITHUB_STEP_SUMMARY"
              else
                echo "❌ Documentation quality checks failed" >> "$GITHUB_STEP_SUMMARY"
                all_success=false
              fi
            fi

            if [[ "$all_success" == "true" ]]; then
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "## ✅ All quality checks passed!" >> "$GITHUB_STEP_SUMMARY"
              echo "result=success" >> "$GITHUB_OUTPUT"
              exit 0
            else
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "## ❌ Some quality checks failed" >> "$GITHUB_STEP_SUMMARY"
              echo "result=failure" >> "$GITHUB_OUTPUT"
              exit 1
            fi
          fi
